<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Manager | Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a5f;    /* Deep Navy Background */
            --secondary: #2c5f8d;  /* Steel Blue Accents */
            --white: #ffffff;
            --cyan-glow: rgba(0, 242, 255, 0.5);
            --square-color: rgba(255, 255, 255, 0.08); /* Soft White Particles */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* Hide default cursor */
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* --- Smooth Follower Styles --- */
        .cursor-container {
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
        }

        #cursor-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--white);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            will-change: left, top;
        }

        #cursor-border {
            position: absolute;
            width: 28px;
            height: 28px;
            border: 1px solid var(--white);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background 0.3s, border-color 0.3s;
            will-change: left, top;
        }

        #cursor-border.hovering {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--cyan-glow);
        }

        /* --- Background Animation --- */
        .background {
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .background li {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px;
            height: 20px;
            background: var(--square-color);
            animation: animate 22s linear infinite;
            bottom: -150px;
            border-radius: 4px;
        }

        .background li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .background li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .background li:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .background li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .background li:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .background li:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        .background li:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }

        @keyframes animate {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 4px; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }

        /* --- Content --- */
        .content {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 1000px;
            text-align: center;
        }

        h1 {
            font-family: 'Inter', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5.5rem);
            font-weight: 900;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: -4px;
            margin-bottom: 60px;
            line-height: 1;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: space-between;
            display: flex;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .nav-button {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            padding: 50px 20px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--white);
            border-radius: 12px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-button:hover {
            transform: translateY(-8px);
            background: var(--secondary);
            border-color: var(--white);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4), 0 0 15px var(--cyan-glow);
        }

        @media (max-width: 768px) {
            * { cursor: auto; }
            .cursor-container { display: none; }
            .grid { grid-template-columns: 1fr; gap: 15px; }
            h1 { letter-spacing: -2px; margin-bottom: 40px; font-size: 3rem; }
            .nav-button { padding: 35px 15px; }
        }
    </style>
</head>

<body>

    <div class="cursor-container">
        <div id="cursor-dot"></div>
        <div id="cursor-border"></div>
    </div>

    <ul class="background">
        <li></li><li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <div class="content">
        <h1>CAMPUS MANAGER <img src="eng.png" alt="evv" style="width: 120px;" /></h1>

        <div class="grid">
            <a href="#" class="nav-button">Gestion des emplois du temps</a>
            <a href="https://absence.compusmanager.com" class="nav-button">Gestion des stagiaires</a>
            <a href="#" class="nav-button">Gestion du personnel</a>
            <a href="#" class="nav-button">Gestion examen</a>
        </div>
    </div>

    <script>
        const mouse = { x: 0, y: 0 };
        const dotPos = { x: 0, y: 0 };
        const borderPos = { x: 0, y: 0 };

        const DOT_SMOOTHNESS = 0.2;
        const BORDER_DOT_SMOOTHNESS = 0.08; // Slightly more lag for extra smoothness

        const dotEl = document.getElementById('cursor-dot');
        const borderEl = document.getElementById('cursor-border');

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        const interactiveElements = document.querySelectorAll('a, button');
        interactiveElements.forEach((el) => {
            el.addEventListener('mouseenter', () => borderEl.classList.add('hovering'));
            el.addEventListener('mouseleave', () => borderEl.classList.remove('hovering'));
        });

        const lerp = (start, end, factor) => start + (end - start) * factor;

        const animate = () => {
            dotPos.x = lerp(dotPos.x, mouse.x, DOT_SMOOTHNESS);
            dotPos.y = lerp(dotPos.y, mouse.y, DOT_SMOOTHNESS);

            borderPos.x = lerp(borderPos.x, mouse.x, BORDER_DOT_SMOOTHNESS);
            borderPos.y = lerp(borderPos.y, mouse.y, BORDER_DOT_SMOOTHNESS);

            dotEl.style.left = `${dotPos.x}px`;
            dotEl.style.top = `${dotPos.y}px`;
            
            borderEl.style.left = `${borderPos.x}px`;
            borderEl.style.top = `${borderPos.y}px`;

            requestAnimationFrame(animate);
        };

        animate();
    </script>
</body>

</html>
